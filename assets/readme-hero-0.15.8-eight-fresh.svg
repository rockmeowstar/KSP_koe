<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">KerbalOverEngineering 0.15.8</title>
  <desc id="desc">Eight metrics from one new all-KOE-absent full cycle and one new KOE 0.15.8 full cycle. Portrait FPS counts actual portrait-camera renders. Activation compares the same ActivateNextStage call. Other mods and settings are unchanged. Fixed run order; one sample each, not a repeatability estimate. Post-fuel FPS is not a separate deep-space measurement. Frame generation off.</desc>
